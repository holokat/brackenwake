<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brackenwake</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f1216; overflow: hidden; }
    #game { position: fixed; inset: 0; }
    #game canvas { display: block; }
    #boot-error {
      position: fixed; inset: 0; z-index: 999; display: none; padding: 32px;
      background: #12151a; color: #f2c9c0; overflow: auto;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="hud"></div>
  <div id="boot-error"></div>

  <!--
    Boot watchdog. main.js sets window.__bw as the last thing it does, so if six
    seconds go by without it, the game did not start. A blank black page tells
    you nothing; the first error the page threw tells you everything.
  -->
  <script>
    (function () {
      var first = null;
      window.addEventListener('error', function (e) {
        if (!first) first = (e.error && (e.error.stack || e.error.message)) || e.message || String(e);
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (!first) first = 'unhandled rejection: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason);
      });
      setTimeout(function () {
        if (window.__bw) return;
        var el = document.getElementById('boot-error');
        el.style.display = 'block';
        el.textContent = 'Brackenwake did not boot within 6 s.\n\n'
          + (first || 'No uncaught error was reported. Check the console and the network tab: a module that never finished loading throws nothing.');
      }, 6000);
    }());
  </script>

  <script type="module" src="/src/game/main.js"></script>
</body>
</html>
