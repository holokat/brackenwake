<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Old Cellars playtest</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#game,#hud{position:absolute;inset:0}#hud{pointer-events:none}#review{position:fixed;bottom:98px;left:16px;z-index:10000;background:#171b1bef;color:#e5d7bf;border:1px solid #a6885855;border-radius:8px;padding:12px 16px;font:12px/1.5 system-ui;max-width:430px}button{font:inherit;min-height:40px;border:1px solid #a6885877;border-radius:5px;background:#353126;color:#f8edd9;padding:6px 12px;cursor:pointer}button:active{transform:scale(.96)}.row{display:flex;gap:8px;flex-wrap:wrap}p{margin:0 0 10px}pre{white-space:pre-wrap;max-height:170px;overflow:auto}#review.closed pre{display:none}</style>
