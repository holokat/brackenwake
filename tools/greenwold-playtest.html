<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greenwold playtest</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#game,#hud{position:absolute;inset:0}#hud{pointer-events:none}#review{position:fixed;left:50%;transform:translateX(-50%);top:12px;z-index:10000;background:#f1eadc;color:#292c21;border-radius:18px;padding:12px 16px;font:13px/1.5 system-ui;box-shadow:0 5px 22px #0005;min-width:420px}#review button,#review select{font:inherit;min-height:40px;border-radius:6px;border:1px solid #c8bda9;background:#fffaf0;color:#292c21;padding:5px 10px}#review p{margin:0 0 10px}#review .row{display:flex;gap:8px}#report{max-height:200px;overflow:auto;white-space:pre-wrap;font:12px/1.5 monospace;margin-top:12px}#review.closed #report{display:none}</style>
<div id="game"></div><div id="hud"></div>
<aside id="review" class="closed"><p id="status">Starting an in-memory playtest character.</p><div class="row"><select id="place" aria-label="Review location"></select><button id="view">View</button><button id="walk">Play here</button><button id="night">Night</button><button id="check">Check</button><button id="details">Details</button></div><pre id="report"></pre></aside>
<script type="module" src="./greenwold-playtest.js"></script></html>
