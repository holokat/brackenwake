## 8. How the story is told without quests

The pillar stands: no quest giver, no log of tasks, no exclamation marks. The
story is delivered by five things the game already half has, and one it needs.

**1. Arrival.** The zone banner and its toast are the first line of every
chapter. The cinematic the user will make plays here, once, on first entry. The
`discovery.checkZone` event already fires exactly once per zone per character.
That is the hook.

**2. The world remembers what you have seen.** This is the one new system. A
`story.js` with a flat set of **facts** on the character record: `saw:weirmark`,
`met:tam`, `has:rhyme`, `promised:fern`, `killed:warden`, `read:tally`,
`hesk:gone`, `said_yes:corvin`, and so on. A fact is set by a trigger the
world already produces: entering a zone, standing near a site, killing a named
monster, picking up a named item, ending a conversation on a particular line.
Nothing asks the player to do anything. The facts are what they did.

**3. People say different things.** The talk window exists. Named NPCs get
lines keyed on facts: what Maud says depends on which act you are in; what
Ysolt says depends on whether you have been to Saltmere; what Hesk reads
depends on what you carry. A line is a `{ when: [facts], say: text, sets:
[facts] }` row. The conversation is the story. The same window that sells
bandages tells it.

**4. Things in the world are readable.** Stones, coffins, a letter in a pack, a
tally, the wall at the bottom of a shaft. `interact.js` already handles
standing near a thing and pressing E; a readable is a site-like record with a
text and a fact it sets. Hesk reads the ones the player cannot, which is why
losing him costs something: after Act II the player carries a script they
cannot read and has to find another reader, and there are two, and one is a
lich and the other is a dead king.

**5. Named encounters and events.** A semi-boss is a monster row with a
`name`, a `site` it stands at, an optional `habit` (a time, a trigger) and a
`says` line. `monsters.js` has the promotion mechanism in `boss()` already; the
open-world names are the same thing at smaller numbers. Events (the Rows at
Midnight, the Birds, the Bell Under the Water, the March) are timed spawns
with a script and no loot, and they are what make a zone feel inhabited by
something other than a spawn table.

**6. The journal.** Not a quest log. A book, on a codex tab, that writes itself
in the player's voice from the facts: "Saltmere. The Steps go down into the
sea and there is a door at the bottom. Ysolt would not say why the water is
where it is." One paragraph per fact that deserves one, in the order they were
learned. A player who has forgotten what they are doing reads their own book.
A player who has never read it loses nothing, because the world will say it
again.

**What the acts gate.** Nothing physical. The Sink's door is the one exception,
and it is a door in the world with a woman standing at it saying not yet. The
Powers of the rim can be walked to on day one and they will kill a tier 1
character, which the danger bands already do. What the acts gate is words: the
General does not ask his question of someone without the crown; Fern does not
sing to someone with a drawn sword; Hesk does not read the tally to someone who
has not brought him the Barrows' name. Knowledge is the key, and the keys are
things the player has to have done.

**Endings.** Three facts at the chair: `sat:you`, `sat:tam`, `sat:nobody`. The
world reads them. Danger bands step down or up. Named NPCs get their last
lines. A character who sat is retired to the chair and a new character can find
them there, which is the one piece of persistence this asks of the save that it
does not already have.

---

## 9. For the cinematics

Every zone's **Arrival** paragraph above is the shot list. Some notes that hold
across all of them:

- Every arrival ends on a **living thing looking back**: the boy on the roof,
  the drowned man on the steps, the golem with snow on its shoulders, the King's
  open eyes, the giant shivering, Hesk turning. The world is inhabited and it
  has noticed you.
- No narration. The zone's one line is the only text, in the banner's serif,
  and it appears as the shot ends.
- Weather and time of day are the zone's own: the Flats at noon, the Barrows
  at nightfall, Witchwood in falling blossom, the Night March at dusk, the Sink
  by torchlight.
- Music: the two themes rotate by biome now. Each act could take one: I is the
  Vale's, II the kingdom's, III the rim's, IV the Vale's again, slower.
- The Vale's arrival is the game's opening and should be the longest. The
  Sink's is the game's ending and should be the shortest: a door, a wind, a
  woman, a boy, and the line.

---

## 10. What this asks of the code, in order

1. `src/mmo/story.js`: facts, the named characters, their lines keyed on facts,
   the readables, the named encounters and events, and the three endings, as
   data. Node-testable. An `auditStory()` that proves every fact set is read
   somewhere and every fact read is set somewhere, so a thread can never dangle.
2. Named NPC placement: six people at fixed sites, with the talk window
   reading `story.js` before it reads the shop catalog.
3. Readables in `interact.js`, and the journal tab.
4. Semi-boss promotion in `monsters.js`: a name, a site, a habit, a line, on a
   rostered row. Events as timed spawns with no loot.
5. The Sink: sealed door, Act IV unseal, the keepers on the landings, the
   chair, the three endings, the retired character.
6. Zone-state: the Vale's four states, the world's danger step after the Fall,
   the rim's thaw after the third ending.

Each of these is a wiring note on its own. None of them moves a zone.

<script type="text/markdown" id="md-cast" data-title="The Cast" data-sub="Sixty named people, what they want, know, sell and say">
# Brackenwake: the cast

The companion to `10-STORY.md`. That book says what each zone is about. This
one says who is standing in it, and what they will talk to you about.

Every person below is written to one frame, because the talk window will carry
all of them the same way:

- **Who.** Name, role, age, one line of how they look and sound.
- **Wants.** The one thing that drives them. Everything they say bends toward it.
- **Knows.** What they can tell you that nobody else can.
- **Offers.** Trade, training, a service, a passage. What the shop side of the
  talk window shows. Where it says *nothing*, the person is not a vendor and
  the window is only talk.
- **Talks about.** The topics, in the order you can earn them. Each topic is
  gated by a fact from `story.js` (in brackets) and sets one when it ends. A
  topic with no bracket is open to a stranger.
- **Tell.** The habit that makes them a person and not a shop: the thing they
  do while you stand there.

Voice is given as one line they would say. Every character gets a different
music. The Vale talks plain and short. The kingdom's remnants talk in old
phrases. The rim talks in whatever three hundred years alone has done to them.

The six who carry the story (Maud, Tam, Hesk, Ysolt, Fern, the Ashen King) are
in `10-STORY.md` section 4 and are only sketched here where they stand.

---

## Act I: The Hedge

### The Bracken Vale

**Maud Fallow.** Hedge-reeve, seventy. Grey shawl, a walking stick she does not
lean on, a way of looking at you as if reading a stone. Voice: *"The stones
said a name. I do not have to like it."*
- **Wants.** The Vale kept. Then, slowly, to stop lying to you about how.
- **Knows.** What the Sink is. What her sister was. Why the stones named you.
- **Offers.** Nothing. She is not a shop.
- **Talks about.** The stones and your name. The gap in the hedge and the six
  words. Each return: what the Vale has lost since you left [each act]. Her
  sister [read:tally]. What a keeper is [act:4]. Whether you should let Tam sit
  [at the chair].
- **Tell.** She touches the nearest boundary stone before she answers anything.

**Osric Hale.** Innkeeper of the Bracken Arms, fifties, a big man gone soft, an
apron that was white once. Voice: *"Every Walker sits in that chair before they
go. Every one of them orders the same thing. Sit down."*
- **Wants.** To have a Walker come back, once, before he dies.
- **Knows.** What every Walker for forty years said the night before leaving.
  Tam's father's last words in the Vale: "back by harvest."
- **Offers.** Food, drink, a bed that heals, the trade channel's board.
- **Talks about.** The last Walker and the cloak [met:maud]. What the Vale is
  saying about you [each act, varies]. Tam's father, if Tam is with you
  [met:tam]. A toast, on your return from each act, with the whole room. The
  Walker who came back, forty years ago, whom he saw again in Crookwell market
  wearing the mark and never told Maud about [met:selwyn, sets: knows:selwyn].
- **Tell.** He wipes the same glass the whole conversation.

**Bett Colley.** Blacksmith, forties, forearms like hawsers, burn-freckled,
laughs once a day at most. Voice: *"That edge is a disgrace. Give it here."*
- **Wants.** To have made something that mattered. She taught you and worries
  it was not enough.
- **Knows.** Iron. That the Iron Shoulder's Hild is the only smith who works the
  cold metals, and that Hild was her master's master.
- **Offers.** Repairs, copper and iron work, blacksmithing training to 50.
- **Talks about.** Your kit, honestly. Hild and the Shoulder [act:2]. The
  coldiron sword, which she will not touch [has:coldsword]. Starfall, which she
  will not have in the forge [has:starfall].
- **Tell.** She takes whatever weapon you are holding and tests the edge on her
  thumbnail while you talk.

**Wenna Pryce.** Healer, thirties, quick hands, quicker eyes, a satchel that
smells of comfrey. Voice: *"You are bleeding on my floor. Talk after."*
- **Wants.** Nobody in the Vale to die of something she could have stopped.
- **Knows.** What the Wake does to a body: she has treated three people who came
  back through the hedge changed and buried two.
- **Offers.** Healing, resurrection, bandages, healing training to 50.
- **Talks about.** What you can and cannot survive out there. The changed ones
  [act:1, after the first night]. What the Wake does to a keeper, which she
  has guessed [act:4].
- **Tell.** She checks your pulse at the wrist while she is speaking, whether
  you asked or not.

**Old Grist** is a boar and the **Sexton** is a skeleton, and neither talks,
but the Sexton rings the church bell when he sees you and Osric says the bell
has rung every night since the Walker left.

### The Mill Run

**Tam Weir.** Fourteen. Slingshot, a map of the Adit drawn on a flour sack,
never quiet. Voice: *"I have been down all three. Nobody else has. Well. One
other."*
- **Wants.** To go with you. To find out what happened to his father. Later, to
  be worth his name.
- **Knows.** The Adit's cuts and the wall in the third that is not the miners'.
- **Offers.** Nothing to sell. In a fight he is a slingshot and a warning.
- **Talks about.** The Adit. His father [after Thornwood]. His name [after
  Wynn]. Whether he is a Weir, and what that means [read:tally]. Hesk
  [hesk:gone]. The chair [act:4].
- **Tell.** He is always slightly ahead of you on the road.

**Ivy Weir.** Tam's mother, the miller, forties, flour to the elbow, tired in
the way that has stopped being tired and become a shape. Voice: *"He will
follow you. I know it. I am asking you to make sure he can come home."*
- **Wants.** Her son alive. She has already lost her husband to the same road.
- **Knows.** Exactly where Tam's father went and when: north, to Ashen Moor, to
  find the monk who could read the old marks.
- **Offers.** Flour, bread, the mill's storeroom as a stash.
- **Talks about.** Tam. Her husband and the monk [met:tam]. The wall in the
  third cut, which her husband found first [saw:weirmark]. Tam's name, which
  she never told him meant anything [read:tally].
- **Tell.** She keeps working the whole time. The mill does not stop for talk.

**Gower Blane.** Foreman of the Millrun Adit, sixties, one eye, a ledger, a
belief that most problems are rock. Voice: *"Copper pays. Tin pays. Whatever is
behind that wall does not pay, so I have not moved it."*
- **Wants.** The Adit to keep paying. He is not a bad man; he is a foreman.
- **Knows.** The third cut's wall, the goblins who have moved in behind it, and
  the price of every ore on the continent.
- **Offers.** Pickaxes, ore purchase, mining training to 40.
- **Talks about.** Ore prices. The goblin chief who wears a stone as a
  breastplate [entered:adit]. The wall, and that "the marks on it are the same
  as on the ford-stone in the Vale, and I never liked that" [saw:weirmark].
- **Tell.** He does sums in the ledger while you talk and tells you the answer
  at the end, whether it was about you or not.

**Sallow Pike** is the goblin warrior in the third cut. He does not talk, but
he has scratched the weir-mark into his own face, and the miners have a rhyme
about him that Gower will not repeat.

### Saltmere

**Ysolt of the Strand**, passing through. Voice here: *"The water is not
rising. It is looking for something."* She sells salvage and says one true
thing and leaves. Her whole self is in the Broken Strand.

**Nance Cockle.** Cockler, sixty, bare feet in all weathers, a voice like a
gull. Matriarch of the Saltmere hamlet. Voice: *"The Steps go down to the
King's floor, and the King came up to count them, and that's the rhyme, and
that's all it is."*
- **Wants.** The tide to keep its times. It has not, lately.
- **Knows.** The cocklers' rhyme, which is the first mention of a king. The
  tide tables, which are the story's clock for the Steps.
- **Offers.** Shellfish, salt, fishing training to 40.
- **Talks about.** The tides and when the Steps show. The rhyme, if you ask
  twice. The drowned man on the Steps at high water, whom she calls the Reeve
  and will not look at [saw:steps]. Ysolt, whom she trusts and does not like.
- **Tell.** She never stops sorting shells into two baskets by a rule you cannot
  work out.

**Piran Cockle.** Nance's grandson, twenty, restless, wants to leave and has
nowhere to go. Voice: *"There is a door at the bottom of the Steps. I have
touched it. Do not tell her."*
- **Wants.** Out. He will ask to come with you and should not be let.
- **Knows.** The door at the bottom of the Weir Steps, because he has dived to
  it at the lowest tide of the year.
- **Offers.** He will dive for anything you drop in the sound, for a price.
- **Talks about.** The door [saw:steps]. What is carved on it, which he drew
  from memory and got half right [has:key1 corrects him]. The Drowned Coast,
  which he wants to see [act:3, he begs].
- **Tell.** He is always wet.

**The Reeve.** The drowned man who stands on the Steps at high water. Named
encounter, a Drowned. He does not talk, but if you stand on the top step at
high water and do not go down, he turns his head toward Saltmere's hamlet and
raises one hand, and Nance, if asked, says that was her great-grandfather's
gesture for "all in."

### The Sedge Flats

**Granny Eel.** The fen-family's grandmother at the Drowned Mill, eighties,
lives on the stilt-house's top floor and has not come down in a decade. Voice:
*"The river went south in my mother's mother's time. I was told. Two hundred
and eighty years, near enough. Now you know something."*
- **Wants.** To be listened to once before she dies. Everyone in the family has
  heard everything.
- **Knows.** The date. The millstone with the charm cut into it. That the fen
  has been getting deeper every year of her life.
- **Offers.** Nothing. She is talk.
- **Talks about.** The river moving. The date, if asked properly. The millstone
  [entered:mill]. Long Sarah, whom she remembers as a normal size [killed:sarah,
  she is furious]. The Hollow Hills, where the river went [act:2].
- **Tell.** She counts something on her fingers the whole time and never says
  what.

**Dylan Eel.** Her grandson, the family's head, thirties, oilskin, a gaff hook,
never looks at the water directly. Voice: *"A sheep a month. It costs less than
a boat."*
- **Wants.** The arrangement to hold. He does not want Long Sarah dead. He wants
  her fed.
- **Knows.** Where Long Sarah lies. The safe paths through the sedge, marked
  with sticks only the family can read.
- **Offers.** Eels, the family's stilt-house as a place to sleep, fishing and
  swimming training.
- **Talks about.** The paths. The sheep. Long Sarah, and why you should leave
  her be [saw:sarah]. The Eel-Man, who was his father [killed:eelman, he thanks
  you and does not mean it].
- **Tell.** He turns everything you hand him over twice, looking for water
  damage.

**Morwen Eel.** Dylan's daughter, twelve, fearless, the only one who goes out
at night. Voice: *"Grandmother says the river went south. I have been south. It
did not stop there."*
- **Wants.** To know what is under the water. She is Tam's opposite: she does
  not want to leave, she wants to go down.
- **Knows.** That the flood has a floor, and there are houses on it, and one of
  them has a light in it.
- **Offers.** She will show you the sunk houses for a hook of your own.
- **Talks about.** The light under the water. The Hollow Hills' door, which she
  has seen from the fen's south edge [act:2].
- **Tell.** She is up a pole when you arrive and comes down head first.

### Kiln Heath

**Enid Brick.** The brickmaker's widow, fifties, clay under every nail, lives at
Fallow's Adit and sells pots. Voice: *"That one I bricked from outside. You
want to know why, you can come back when you have been down the Cellars."*
- **Wants.** Nobody to open the bricked kiln. Then, when you have, for him to
  be buried.
- **Knows.** Which kiln has the stair. What her husband became. What the
  cultists pray to.
- **Offers.** Pots, clay, the Adit's copper and tin, pottery training to 40.
- **Talks about.** The kilns and which is which. The Cellars' bandits, who buy
  her pots. The bricked kiln [entered:cellars]. Her husband, in full, and asks
  you to end it [act:3]. Whether it is the same thing as the keeper, when she
  hears what a keeper is [act:4].
- **Tell.** She throws a pot on the wheel throughout and it is always the same
  pot.

**Caradog Wynn.** Ex-cultist, twenties, sitting in the sun outside the Cellars
with his robe off, shaking. Voice: *"They say open. All day. Open, open. I said
it too. Then I heard what answered."*
- **Wants.** To go to the Vale and never see a kiln again. He will walk with you
  as far as the hedge and stay there.
- **Knows.** The Cellars' layout, the Kiln-Warden's face, and the word.
- **Offers.** Nothing. He is the game's first turncoat.
- **Talks about.** The Cellars. The word "open," which he says once and will
  not again [sets: heard:open]. Hesk, whose name the Abbot Below spoke, which
  Caradog took for a saint's [act:2, when you mention Hesk].
- **Tell.** He flinches at the kilns every time the wind moves the ash.

**Rhys the Torch.** Bandit captain of the Cellars' upper level, forties, a
burned scalp under a cap, honest in the way thieves are. Voice: *"We were here
first. They came up from below. We keep the stair and they keep to it. You are
welcome to change that."*
- **Wants.** The cultists gone from under him. He will pay you to do it and
  fight you after.
- **Knows.** The Cellars' second level, the cultists' numbers, and that the
  bricks at the bottom have a mark on them.
- **Offers.** Stolen goods, a fence for anything you do not want asked about.
- **Talks about.** The arrangement. The mark, which he thinks is a king's
  [saw:weirmark]. A bounty on the Kiln-Warden.
- **Tell.** He counts your gear and names a price for each piece, aloud.

### The Grey Barrows

**Aldous the Quiet.** Necromancer of the Long Barrow, sixties, night only,
robes that were good once, a voice that has not been raised in thirty years.
Voice: *"They call it the Wake. They say it came in on the tide. They are dead
and they are still afraid of it, which I have found instructive."*
- **Wants.** To know. Not to use, not to free, not to heal. To know.
- **Knows.** What the dead say: the word Wake, the tide, that the Vale has a
  keeper. He will not say more about the keeper "because they will not."
- **Offers.** Necromancy training to 60, bone components, the spellbook's
  first pages.
- **Talks about.** The dead and what they say. The Wake [sets: knows:wake]. The
  spiral and its calendar. Ossian's empty coffin, once you have seen it
  [saw:coffin]. The keeper, one sentence [read:tally]. Hesk, whom he calls "the
  hopeful one" and does not trust [met:hesk].
- **Tell.** A skeleton stands behind him the whole time, holding his lamp, and
  he corrects its posture twice, gently, the way you would a nephew. The
  skeleton is Owain, his brother, and Aldous has never asked him a question.
  See `12-UNFORGETTABLE.md`.

**Sir Anselm of the Vault.** Bone Knight, keeper of the Barrow Cellars. He
speaks before he fights and this is the game's first talking monster. Voice:
*"My name is Anselm. I was set to keep this row. One is empty. That is not my
failing. Do not touch the others."*
- **Wants.** The row kept. He will let you leave if you do not touch a coffin.
- **Knows.** That Ossian's coffin was never filled. That the king rode east and
  "did not come back to us, and we did not go to him."
- **Talks about.** His duty, once. Ossian, if you say the name [knows:ossian].
  He will not speak twice.
- **Tell.** He straightens the lid of the coffin nearest him before he draws.

**Gwil Mound.** A grave-robber, thirties, camped at the Barrows' outer ring,
cheerful, missing two fingers. Voice: *"Outer rings are safe and poor. Inner
rings are rich and not. I work the middle. So does he, and he is not paying."*
- **Wants.** The Counting Man dead. It counts him every night and he cannot
  sleep.
- **Knows.** The spiral's rule: newer inward. Which mounds have been opened.
  That the dead stand up at midnight and face south east, and where to stand
  so they do not notice you.
- **Offers.** Grave goods, silver, a map of the spiral for a price.
- **Talks about.** The spiral. The Counting Man and its number [killed:
  counting man, he pays]. The midnight rows [saw:rows]. Aldous, whom he thinks
  is harmless and is wrong.
- **Tell.** He weighs a coin on his palm before he answers anything, as if
  deciding what the answer is worth.

### Thornwood

**Brannoc.** The ranger at the wood's edge, fifties, one name, a longbow taller
than he is, speaks to dogs more than people. Voice: *"Seven dens. One alpha.
You will not find the alpha. He will find you. I am telling you where the dens
are so that you are standing somewhere useful when he does."*
- **Wants.** Greymaw dead. Greymaw killed his dogs. All of them, over years.
- **Knows.** The dens. The cold fire and whose it was. The Long Dark, which he
  has been into once and will not describe.
- **Offers.** Archery and tracking training to 60, arrows, hides, a dog if you
  earn it.
- **Talks about.** The dens and the map. The cold fire and the Walker who made
  it [saw:coldfire]. Greymaw's pin [killed:greymaw]. Tam, whom he watches and
  says nothing about until Tam is out of earshot: "he is going to follow you
  whatever you do. Teach him the bow." The Long Dark [act:2].
- **Tell.** He is never looking at you. He is looking past you, at the trees.

**Greymaw** is a Dire Wolf with a Walker's cloak-pin in his hide and he does not
talk, but Brannoc says Greymaw has come to the edge of the wood three times and
looked at the ranger's hut and gone back, "which wolves do not do."

**Delwyn Ash.** A charcoal burner who lives in a clearing a mile in and has
never been taken, thirties, soot to the eyes, talks to the wolves. Voice: *"They
do not take me. I do not know why. I have stopped asking."*
- **Wants.** To be left alone by everyone, wolves included. He is the zone's
  one mystery: the wolves leave him be because the Wake has touched him and
  they know their own.
- **Knows.** Where the pack sleeps by day. That Greymaw "talks in his sleep."
- **Offers.** Charcoal, and the only fire in the wood you can sleep by.
- **Talks about.** The wolves' habits. What Greymaw says in his sleep, which is
  "open" [heard:open, he goes white]. Sir Bryn of the Long Dark, whom he has
  seen at the wood's far edge at full moon [act:2].
- **Tell.** He never faces the fire. He faces the dark and lets the fire warm
  his back.

---

## Act II: The Kingdom

### The Broken Strand

**Ysolt of the Strand.** Salvager, forties, a needle like a knife, a chart of
the Drowned Coast twenty years in the making. Voice: *"I have lost two boats
and a brother to that coast. You want to go there, you will need a reason I
believe."*
- **Wants.** Aled back. She will not say so until the fire, late.
- **Knows.** The Drowned Coast's channels. The line of the drowned at the
  Steps and who is tenth in it. That Crook's Delve has a boat in it.
- **Offers.** Salvage, sailing and fishing training to 60, passage across the
  sound [act:3, with a reason].
- **Talks about.** Salvage prices. Crook's Delve and the tide mark
  [entered:delve]. The boat and the key [has:key5]. Aled, once [nightfall at
  camp, sets: knows:aled]. The Drowned Coast, and no. Then yes [act:3, after
  Cinderreach or the Frostcrown]. Aled, after [act:3 ending].
- **Tell.** She sews the whole time and never pricks herself and never looks at
  the needle.

**Hedd Salt.** Ysolt's mate, sixties, a face like a cliff, one word where one
will do. Voice: *"Aye."*
- **Wants.** Ysolt not to sail east. He will say this in four words if pressed.
- **Knows.** Every wreck on the Strand and who was in it.
- **Offers.** Rope, tar, boat repair.
- **Talks about.** Wrecks, in one word each. Ysolt's brother: "Good lad. Went."
  The Stack-Queen and what she says: "Don't."
- **Tell.** He is always coiling a rope, and the coil is always perfect.

**Mother Crab** is a Crab the size of a cart and does not talk, but Hedd says
she has been in the Delve "since my father" and he does not want her killed:
"She keeps the harpies off the boats."

**The Stack-Queen.** A Harpy on the tallest stack who has learned three words:
"come up here." Named encounter. Hedd says a sailor a year does.

### The Ember Flats

**Rook.** Mine-captain of the Ember Cut, forties, burn scars to both elbows,
looks at the ore while she talks to you and at you while she talks about the
ore. Voice: *"They carried it north east to the coast. You can see where. The
sand is glass. Do not take the ore into the Vale."*
- **Wants.** Her miners alive to forty. Most are not. She mines a thing she
  knows is wrong because it pays for the ones who are.
- **Knows.** The glass road. The sledge-shape in the deepest cut. That the
  cultists recruit from her shift and she cannot stop them.
- **Offers.** Emberite, iron, mining training to 70, the Cut's forge.
- **Talks about.** Emberite and what it does to skin. The glass road [sets:
  knows:glassroad]. The sledge [entered:embercut]. The Recruiter, whom she
  wants gone. The Vale, and the warning, every time you leave.
- **Tell.** She breaks ore with a hammer through the whole talk and the ore
  glows where it breaks and she never looks at the glow.

**Selwyn, the Recruiter.** Cultist captain on the Flats' edge, sixties and
looks forty, a beautiful voice, clean robes in a country where nothing is
clean, a cup of water that is always cold. He was the Vale's Walker two
generations ago, sent out by a younger Maud, and he came back and was not let
in. He is the story's recurring human antagonist and he never draws a weapon.
See `12-UNFORGETTABLE.md`. Voice: *"You are the new one. She has not told you
yet. She never does at first. Drink. It is only water."*
- **Wants.** You, wearing the mark. And for someone from the Vale to hear what
  happened to him.
- **Knows.** What the hedges are made of. That he sat in the chair for a week.
  Hesk's name and correspondence with the Abbot Below. The Sallow Fall's shifts.
- **Offers.** The mark, a real item, at every meeting. Taking it sets a fact
  every character reads. It can be taken off; nobody forgets you wore it.
- **Talks about.** Water, first. The Guest, gently. Hesk [sets: hesk:named].
  The Kiln-Warden, "a zealot, we do not all burn ourselves." The Vale and what
  it sits on, which he knows [read:tally, he smiles]. Maud, by her first name,
  which nobody else uses. The chair, and the week [act:4, in the Vale's lane].
- **Tell.** He offers you water before anything, and it is always cold, and
  nothing else on the Flats is. In the Vale in Act IV it is warm, and he looks
  at the cup.
- **Recurs.** Kiln Heath first (the cultist camp outside the Cellars), the
  Ember Flats, the Sallow Wastes, the Vale in Act IV. Always one zone ahead.

**Cai Blister.** A miner of the Cut, twenties, the youngest on the shift, dying
of emberite and cheerful about it. Voice: *"Rook says forty. I say she is
optimistic. Buy me a drink at the Kiln when I am dead."*
- **Wants.** Someone to remember his name. He will ask you to say it back.
- **Knows.** The Sledge-Master's chamber and the safe way past it.
- **Offers.** He will sell you his emberite share cheap.
- **Talks about.** The Cut's deep floor. The Sledge-Master, who was his
  brother's foreman. Noon the manticore, and the rock it sleeps on, and the
  hour it wakes.
- **Tell.** He coughs, and looks at what he coughed, and puts it in his pocket.

### The Hollow Hills

**Old Wynn.** Last warden of the Weir Tower, eighties, blind, a memory that has
replaced the records page by page as they rot. Voice: *"Seven weirs. Six of
stone. And one where the bracken grows. The rhyme places it, and I was never
taught the rhyme."*
- **Wants.** Someone to have heard the recitation before he dies. Then, when
  he hears Tam's name, for the boy not to go south.
- **Knows.** The kingdom's records, entire. The six weirs and their places.
  That a Weir still lives, when he hears one speak.
- **Offers.** Nothing to sell. Lore training, if the skill exists; otherwise
  only talk.
- **Talks about.** The tower and its road. The recitation [needs: knows:ossian,
  sets: knows:sixweirs]. The seventh weir and the rhyme. Tam's name [met:tam,
  sets: tam:named]. The Stone Garden's tally, "which I was never permitted to
  read, and which the Warden keeps." Hesk, whom he taught to read [met:hesk].
- **Tell.** He recites with his eyes closed and his hand moving as if turning
  pages, and stops mid-sentence if you move, and waits.

**Siwan Underhill.** Head of the Hollow Hills hamlet, fifties, speaks in a
whisper, everyone here does. Voice: *"Quietly. The sound carries. Everything
you say down here is heard by something."*
- **Wants.** The Painted Door to stay painted. She knows it opens.
- **Knows.** Which doors are real. The Workings' upper level, where her
  grandparents lived before "the counting man came up from the granary."
- **Offers.** Root vegetables, candles, shelter, the hamlet's cellar as a stash.
- **Talks about.** The doors. The Painted Door and the night it opens
  [saw:painteddoor]. The Granary Wraith, whom she calls the Quartermaster.
  The river under the hills, which is the one from the Sedge Flats
  [knows:rivermoved].
- **Tell.** She puts a finger to her lips before every sentence, out of habit,
  not at you.

**Bedwyr Hollow.** A young man of the hamlet who wants to go down into the
Workings and reclaim them, twenties, loud in a place where nobody is. Voice:
*"My grandfather's table is still set down there. I want to eat at it."*
- **Wants.** The Workings back. He will follow you in if you let him and die if
  you are careless, and Siwan will not forgive you.
- **Knows.** The Workings' second level from his grandfather's stories.
- **Offers.** He will carry. That is all.
- **Talks about.** The Workings. The table. The Mire Troll in the granary hall
  [entered:workings]. His grandfather's chair, if you clear the hall [killed:
  quartermaster, he goes down and eats and comes back different and quiet].
- **Tell.** He speaks at full volume and everyone within earshot winces.

### Witchwood

**Fern.** Ten. Dead three hundred years and does not know it. Voice: *"Has my
father stopped being angry? He was angry when he sent me. Will you tell him I
am being good?"*
- **Wants.** To go home to the hall by the sea. To be told her father is not
  angry.
- **Knows.** The rhyme, as a skipping song. That her father was a king and did
  not like being one.
- **Offers.** Nothing. She will give you a petal and it does not fade.
- **Talks about.** Whether you are a servant sent to fetch her. Her father. The
  rhyme [needs: knows:sixweirs, sets: has:rhyme]. The promise [sets:
  promised:fern]. What you said to her father [after Cinderreach, kept or
  broken, and she knows which].
- **Tell.** She brushes petals off the stone as she talks and there are always
  more.

**Idris Coal.** A charcoal burner at the wood's edge, sixties, will not go in,
has not gone in for forty years since the day he saw the child. Voice: *"There
is a girl in there. Do not tell her anything. I told her the year once and she
cried for a week and the blossom fell like snow."*
- **Wants.** Fern left in peace. He is the closest thing she has to a guardian
  and he has never been within a hundred yards of her.
- **Knows.** How to approach the stone: alone, unarmed, and wait.
- **Offers.** Charcoal, and the last fire before the silence.
- **Talks about.** The girl. The rule. The Blossom Mother and the drawn steel.
  What he told her, and what happened [has:rhyme]. What to tell her, and what
  not to, when you come back from the coast [after Cinderreach].
- **Tell.** He faces the wood the whole conversation and never blinks.

**Nest Hazel.** A herbalist who gathers at Witchwood's edge for what grows
nowhere else, thirties, sharp, unsentimental. Voice: *"Blossom out of season
means roots out of season. Half of what I sell comes from here. Do not ask me
what it does to the people who take it."*
- **Wants.** The wood to stay as it is. It is her livelihood.
- **Knows.** Verdite grows under the roots here. The Wake's herbs and what they
  do.
- **Offers.** Alchemy training to 60, herbs, potions, verdite in small pieces.
- **Talks about.** Herbs. Verdite [sets: knows:verdite]. The Long Dark's
  Marl's Seam, where verdite is in the wall [act:2]. Fern, whom she has never
  seen and does not believe in.
- **Tell.** She tastes everything she picks, a fleck on the tongue, and spits.

### The Iron Shoulder

**Hild Ironshoulder.** The only smith who works coldiron, sixties, forearms
blue-veined from the metal, a hammer she has named. Voice: *"Coldiron takes an
edge nothing else does and it takes something back off whoever carries it. I
will sharpen it. I am asking where you mean to use it."*
- **Wants.** Her craft to outlive her. Nobody has learned coldiron in twenty
  years. She trained Ulfra's smith in the Frostcrown and has not seen her since.
- **Knows.** What the Guest's metals do to the carrier. The Low Shoulder's
  armoury. Bett Colley's lineage.
- **Offers.** Coldiron work, blacksmithing training to 100, the Shoulder's
  forge.
- **Talks about.** The metals, honestly [sets: knows:coldiron]. The sword
  [has:coldsword, she goes quiet, then sharpens it]. Her apprentice in the
  Frostcrown, and a message for her [act:3]. Bett, whom she has heard of and
  approves of. Starfall, which she will work once, for the chair [act:4].
- **Tell.** She holds your weapon up to the forge light and turns it and does
  not speak until she has seen the whole edge.

**The Watch at the Low Shoulder.** An Iron Golem at the old cut's mouth with
snow on its shoulders. It says one word to anyone who stands before it a
minute: "pass." Named encounter, and it can be asked more, once, if you carry
the sword: "The wyvern. In the second. I cannot go in. It is not in my
orders." It is very sorry if fought.

**Morcant Ore.** The Shoulder town's headman and the Deep Shoulder's owner,
fifties, rich by the standards of a country with no money, a chain of office
made of ore samples. Voice: *"Four mouths. Ogres in the fourth. I will pay to
have them out. I will not pay to have the Foreman out. The Foreman is the
reason the other three still work."*
- **Wants.** The Deep Shoulder producing. He respects the Foreman as a fellow
  manager.
- **Knows.** The golems were the kingdom's and still keep the kingdom's shifts.
  The Foreman "rings a bell nobody can hear and the golems change over."
- **Offers.** Silver, iron, ore purchase at the best price on the continent,
  the town's bank.
- **Talks about.** The mines. The ogres and the bounty. The Foreman, and a
  plea not to [entered:deepshoulder]. The Stone Shepherd on the high shoulder,
  which takes a bear's worth of his goats a month.
- **Tell.** He fingers a different ore sample on his chain for each subject.

**Efa Cold.** A miner of the Low Shoulder, the only one who still goes in, thirties,
frostbite scars on her face, quiet. Voice: *"It lets me pass too. I do not know
why. I think it is lonely."*
- **Wants.** The golem talked to. She has tried for years.
- **Knows.** The Low Shoulder's second cut and the wyvern's den. The armoury,
  which she found and did not touch.
- **Offers.** Coldiron ore, the only source outside the Frostcrown.
- **Talks about.** The golem. The wyvern. The armoury and the sword in its stand
  [sets: knows:armoury]. What the golems do when you carry the sword past them
  [has:coldsword]: "they turned. All of them. I have never seen them turn."
- **Tell.** She rubs her scarred cheek with the back of her hand when she is
  thinking, and she is always thinking.

### The Long Dark

**The Elder.** A treant older than the others by a thousand years. It speaks
only to someone carrying the coldiron sword, and says one thing: *"It did not
fall. It was dropped. Whatever dropped it wanted rid of it. Your kingdom picked
it up."* Named encounter; it asks nothing and is fought only if you cut a tree
in its sight. In Act IV it stands in the Vale's lane.

**Sir Bryn of the Wood.** Werewolf, a knight of the Weir Kings, wears what is
left of his surcoat, will duel once at the full moon and yield at half health.
Voice: *"They carried it past here in a box with three men on it, and two of
them were weeping, and the third was the king."*
- **Wants.** To have done his duty. He was set to guard the western border and
  the border is gone and he is still guarding it.
- **Knows.** The Guest's passage. That Ossian wept. That the pack were all
  knights once.
- **Talks about.** The duel, first. The box [after yielding, sets: knows:
  wept]. Fern, whom he carried inland: "I left her at a stone in a wood where
  the blossom was. I did not go back. I could not go back as this."
  [has:rhyme]. The Vale, in Act IV: he brings the pack.
- **Tell.** He wipes the blade of a sword he no longer has.

**Marl Himself.** A Ghoul in a prospector's coat in Marl's Seam. Named
encounter. He does not talk in words; he beckons, and shows you the seam, and
beckons, and shows you the seam.

**Heledd Marl.** The prospector's great-granddaughter, camped at the Long
Dark's edge, forties, has come to bring him out and cannot make herself go in.
Voice: *"He found the green gold and it found him back. I have his map. I do
not have his nerve."*
- **Wants.** Marl buried. She will pay in his map, which shows every verdite
  vein in the wood.
- **Knows.** Verdite's price and its danger. The Seam's layout from his letters.
- **Offers.** Prospecting training, the map [killed:marl].
- **Talks about.** Marl. The Seam. Verdite [knows:verdite]. The Elder, which
  her great-grandfather wrote of as "the old one who watches and does not
  mind me." The Frostcrown, where she means to go next [act:3].
- **Tell.** She reads the same letter over while you talk and has it by heart.

### Ashen Moor

**Brother Hesk.** Scholar of the Grey Hall, fifties, brown robes, a lamp, the
kindest face in the game. Voice: *"You have brought me things to read. Nobody
has brought me anything to read in thirty years. Sit. Sit."*
- **Wants.** To understand. Then, having understood, to fix it. He never wants
  anything for himself and that is what makes him dangerous.
- **Knows.** The old script. What a weir is for. What the seventh is made of.
  Tam's father. Eventually, what the Guest said to Ossian.
- **Offers.** Reading. Scholarship training. The Hall's library as a stash.
- **Talks about.** Everything you carry, in delight. The weirs [sets:
  knows:weirs]. Tam's father and the cloak [met:tam]. The Steps' note to Maud
  [read:note]. The Stone Garden, and asking to come [sets: hesk:with]. At the
  Garden: the tally, half of it [read:tally]. Then the letter, and gone. In the
  Sallow: everything, patiently, as a lich.
- **Tell.** He holds every object you show him up to the lamp and turns it and
  says "oh" softly before he says anything else.

**Peredur Peat.** Head of the peat-cutters, fifties, thinks Hesk is a saint,
brings him food. Voice: *"The Brother has kept the Hall forty years alone. If
that is not holiness I do not know the word."*
- **Wants.** Hesk safe and honoured. He will not hear a word against him, ever,
  including after.
- **Knows.** The moor's safe paths. The Heather-Fire's walk. That the Abbot
  Below "was one of ours, once, and read a page he should not have."
- **Offers.** Peat, food, the cutters' hut, shelter from the moor's cold.
- **Talks about.** Hesk, at length. The Ashen Steps and the cultists. The
  Abbot. The bear that sings. Hesk gone [hesk:gone, he refuses to believe it].
  Hesk in the Sallow [act:3 end, he goes to the Hall and sits in Hesk's chair
  and will not come out].
- **Tell.** He crosses himself at the Hall's door every time he passes it.

**The Abbot Below.** Cultist, founder of the order in the Steps, sixties,
keeper of the Ashen Steps' second level. Voice: *"I read one page. One. The
Brother has read all of them and calls himself a scholar. We want the same
thing. I am only honest about it."*
- **Wants.** The Guest woken. He is Hesk without the kindness or the patience.
- **Knows.** The missing page. The note to Maud, which he has read and left
  because it "changes nothing."
- **Talks about.** Hesk, contemptuously. The page. The Walker's bones and the
  note [sets: saw:note]. The word.
- **Tell.** He holds the missing page and will not let you see it and it burns
  with him.

### The Stone Garden

**The Tally-Keeper.** An Iron Golem that walks the rows re-cutting the stones
where weather has worn them. Named encounter. It does not talk. If you stand
by a stone it is cutting, it stops, and waits, and resumes when you move. Hesk
says it is "the only honest historian on the continent."

**The Warden of the Cut.** The first boss. It does not talk. The door it guards
is the size of a barn because so is it, and Hesk, reading the tallies on the
way down, finds the year it was built and the cost, and says the cost was
"more than the kingdom spent on bread that year."

The Stone Garden has no living people, and that is the point of it. Hesk and
Tam are the only voices, and the zone is where you lose one of them.

---

## Act III: The Vigils

### Cinderreach

**The Ashen King.** Ossian. On his chair, in a hall of glass, three hundred
years. Voice: *"I asked it for a weir against death. It gave me one. For me.
Only for me. Sit down. Nobody has sat down in a very long time."*
- **Wants.** To be asked a question. Then to be quick.
- **Knows.** What the Guest said. That it was dropped. That it does not want to
  be here. That Hesk came through and thanked him.
- **Talks about.** Why you came. The Guest [sets: knows:guest]. Fern
  [promised:fern: kept, he weeps and the fight is slower and he does not use
  the crown; broken or not mentioned, the fight is what it is]. Hesk [sets:
  hesk:washere]. The crown, and what to do with it.
- **Tell.** He does not move anything but his eyes until he stands, and when
  he stands the glass of the floor cracks under him.

**Gethin Glass.** Mine-captain of the Cinder Cut, forties, coughs black, a
voice like gravel in a bucket. Voice: *"The yard rings when you walk on it. You
get used to it. You do not get used to the hall. Nobody goes to the hall."*
- **Wants.** His shift paid before they die. Everything else is somebody
  else's.
- **Knows.** Voidrock and how to carry it. The hall's door and that "the miner
  who went in came out and sat down on the yard and did not get up, and we
  buried him sitting."
- **Offers.** Emberite, voidrock, mining training to 90, the Cut's forge, which
  will work voidrock if you bring Hild's word.
- **Talks about.** Voidrock [sets: knows:voidrock]. The hall, and no. The Bell,
  the manticore that comes at shift change. Hesk, who "went in and came out
  and said thank you to the door" [hesk:washere].
- **Tell.** He stamps the yard once as he talks and listens to it ring and nods.

**Anwen Tide.** A woman who came to Cinderreach to find the king's court, a
descendant, thirties, has a family tree on vellum and a small good sword.
Voice: *"My line goes back to a lady of his court. I came to see if she was
still sitting up. She is. Third chair on the left. She does not know me."*
- **Wants.** Her ancestor released. She cannot do it herself.
- **Knows.** The crypt under the hall, the court's names and chairs.
- **Offers.** A vampire knight's location and name, and her own blade if you
  free her line.
- **Talks about.** The court. Her lady [entered:hall]. What the king says,
  which she has listened to from the door for a year and never dared answer.
  Fern, whose name is on her tree with no date of death.
- **Tell.** She unrolls the vellum and traces the line with a finger while she
  talks, and stops at the same name every time.

### The Drowned Coast

**Sir Caradoc, the Drowned Knight.** Knight marshal, three hundred years in the
water. Voice: *"The gate held. Tell the Vale's keeper the gate held. That is
the only message I have and I have had nobody to give it to."*
- **Wants.** The message given. Then the sea to go down. He knows only one of
  those can happen.
- **Knows.** That the Weir Kings never built a weir without a man in it. That
  the stone was only there to give the man something to lean on.
- **Talks about.** The line, and standing in its way. Aled [knows:aled: "take
  him. I did not ask him to come."]. The weirs [sets: knows:leanon]. The Vale's
  keeper, and his message [sets: has:caradocmsg]. He laughs once, at the
  question about the seventh, and it is the game's saddest sound.
- **Tell.** Water pours off him the whole time and the pool at his feet never
  grows.

**Aled.** Ysolt's brother, a Drowned in a salvager's coat, tenth in the line. He
does not speak. When Ysolt stands in front of him he stops, and the line stops
behind him, and the knight turns to look, and what happens next is Ysolt's.

**The Harbourmaster.** A Drowned in a chain of office who checks every boat that
lands. Named encounter. He says one thing, to Ysolt: "Your brother's boat is
still here. Slip four." It is.

### The Frostcrown

**Ulfra Coldseat.** Thane of the frost giants, sitting on the Frostcrown Shaft,
forty feet of her, shivering. Voice: *"Your people sit on it too. Ours just
sits harder. Tell Maud Fallow we are still here. She will know what it costs."*
- **Wants.** Her people to stop dying. She knows they will not while she sits.
  She sits.
- **Knows.** What is at the bottom of the Shaft. That Hesk went down "and came
  up faster, and did not stop to thank me, which the monks used to."
- **Offers.** Passage down the Shaft, once, if you carry a message for Maud.
- **Talks about.** The Vale, which she knows of. Maud, whom she has never met
  and has corresponded with by a runner every ten years [sets: has:ulframsg].
  The Shaft and what is at the bottom. Hesk [hesk:gone]. The chair, in Act IV:
  she cannot come. She sends the cold.
- **Tell.** She shivers, and every time she does the snow around the Shaft melts
  a little further, and she looks at it.

**Brenna Coldseat.** Ulfra's daughter and the giants' smith, the one Hild
trained, thirties in giant years, a hammer the size of a door. Voice: *"Hild
taught me. Tell her the rimesteel takes the edge she said it would and I have
not told anyone how she said to do it."*
- **Wants.** Her mother off the Shaft. She would sit instead. Ulfra will not
  let her.
- **Knows.** Rimesteel, the fifth ore. The Rime Cut.
- **Offers.** Rimesteel work, blacksmithing to 100 in the giants' way, if you
  bring Hild's word [has:hildmsg].
- **Talks about.** Hild. Rimesteel [sets: knows:rimesteel]. Her mother, and
  the argument they have every night. The White Pack, and Rimemouth, who takes
  the herd.
- **Tell.** She works a piece of rimesteel cold, with her hands, and it bends.

**Skarn.** A frost giant gone wrong in the Shaft's upper level, the giants' lost
one, Ulfra's brother. Named encounter, a Frost Giant with a name and one line
if you carry Ulfra's message: "Tell her I am warm now." Then the fight.

### The Teeth

**Pellam Starfall.** A buyer camped at the edge of the rows who has never gone
in and pays for what others bring out, sixties, fat in a thin country, a scale,
a ledger of the dead. Voice: *"Voidrock, by weight. Starfall, by the piece.
Forty one people have sold to me. I have their names here. None of them sold
twice."*
- **Wants.** Starfall. He is the story's one plain merchant of the Guest's bone
  and he sleeps fine.
- **Knows.** The rows' silence and what breaks it. The Cyclops's blindness.
  Forty one ways not to come back.
- **Offers.** He buys voidrock and starfall at the best price anywhere and sells
  nothing, and will sell you the ledger's names for a story.
- **Talks about.** Prices. The ledger. The Mother, whom he has never seen and
  describes exactly. The shard [has:shard, he offers everything he owns].
- **Tell.** He weighs your pack with his eyes while you talk and names the
  figure at the end.

**The Mother of Spiders** does not talk. **The Cyclops of the Teeth** does not
talk. The Teeth are the one zone where the only voice is Pellam's, at the edge,
and the silence past him is the point.

### The Night March

**Marshal Corvin.** General of the March, a Lich on a stone chair with his sword
across his knees at the bottom of the Night Shaft. Voice: *"We marched north to
draw it off. We drew it off. Nobody came to tell us we could stop. Are you it?"*
- **Wants.** Orders. He has waited three hundred years for someone to say the
  word and he does not know what the word will do.
- **Knows.** The kingdom's last campaign. What his men say in their sleep.
- **Talks about.** The campaign. The question, if you wear the crown
  [has:crown]. Yes or no [sets: said_yes:corvin or said_no:corvin]. If yes, in
  Act IV's third ending, the March comes south. If no, he says "then we wait,"
  and they do.
- **Tell.** His hand rests on the sword and never closes on it.

**Lowri Lamp.** The Lamplighter, a woman of fifty who lives at the March's edge
and lights lamps along the tree line every dusk so the dead do not come into
the open, and has for thirty years. Voice: *"They stop at the lamps. I do not
know why. I light them anyway. You would too."*
- **Wants.** One night off. She has not had one in thirty years.
- **Knows.** The March's timing to the minute. The Straggler, whom she gives
  directions to every few nights.
- **Offers.** Lamp oil, a bed, and if you light the lamps for her one dusk she
  sleeps and tells you the thing she has never told anyone: her husband is in
  the third rank.
- **Talks about.** The lamps. The March. The Straggler. Her husband [after the
  night off, sets: knows:lowri]. The Cold Adit and the man in the ice, whose
  letter she has read and put back.
- **Tell.** She trims a wick while she talks and her hands never stop.

**The Straggler.** A Bone Knight who missed the last step down and has been
looking for the shaft by daylight for three hundred years. Named encounter. He
asks directions. If you give the right ones he thanks you and goes down and is
in the ranks that night. If you give the wrong ones he is grateful anyway.

### The Sallow Wastes

**Brother Hesk**, as he is now. Voice: *"It is a child. It is having a
nightmare. The Wake is the nightmare leaking. I have almost woken it. A Weir's
voice would finish it. Where is the boy?"* Everything he says is true as far as
he knows, and he asks about Tam every time, gently, and means it both ways.

**Ffion Shift.** Forewoman of the Sallow Fall, forties, was a miner and is a
cultist and does not see a difference, dust to the eyes, calm. Voice: *"We mine
what landed. It is the best ore there is. The Brother says it is a child. Fine.
It pays."*
- **Wants.** The shift to keep. The Fall is the only work in the Wastes.
- **Knows.** The Fall's three levels. The point where the walls stop being
  rock. That Ashrend the dragon "came here to die and changed its mind."
- **Offers.** Starfall, voidrock, mining training to 100, the Fall's forge.
- **Talks about.** Starfall [sets: knows:starfall]. The Fall's levels. Hesk,
  fondly. The One Who Left, who was on her shift. The shift change and the
  sitting on the rim, which she cannot explain and does every day.
- **Tell.** She sits down facing the crater's centre at some point in every
  conversation without noticing she has done it.

**Gruffydd Wall.** A miner who will not go below the second level, sixties, the
oldest man on the shift, the only one who is afraid. Voice: *"Below the second
the walls are not rock. Put your hand on them. Then tell me what they are."*
- **Wants.** Out, and he is too old and too far. He will give you everything he
  has to be walked to the Ember Flats.
- **Knows.** The throat's safe ledges. The dragon's phase where it speaks.
- **Offers.** His starfall share, all of it.
- **Talks about.** The walls. Ashrend and the voice it uses [entered:fall]. The
  cultist shift and how it started: "one day we all sat down at once." Hesk,
  whom he is the only person in the Wastes to be afraid of.
- **Tell.** He keeps his back to the crater at all times and walks backward to
  do it.

**Ashrend.** The Bone Dragon on the crater floor. In its speaking phase it stops
fighting and says, in Hesk's voice: *"You see? It only wants to be understood."*
Then it does not stop fighting.

---

## Act IV: The Wake

### The Bracken Sink

Everyone who is still alive and was earned is in the Vale's lanes, and each has
one line, keyed on their own arc, as you pass. Ysolt with her crew at the
mouth. Hild with the Shoulder's miners. Brannoc with a dog. Sir Bryn and the
pack. The Elder in the lane with its roots in the hedge. Nance Cockle, of all
people, with a basket of shells and a gutting knife. Aldous, who has never
left the Barrows, at the Sink's door with his skeleton holding the lamp. And
the keepers on the landings, forty of them, each with a name cut in the wall,
each with one sentence if you say it:

- **Brigid Fallow**, the last, Maud's sister, on the lowest landing: *"Tell
  her I sat down glad. She will not believe you. Tell her anyway."*

And Maud, at the mouth, and Tam, at the chair.

---

## The count

Sixty three named people across twenty two zones, six of whom carry the story,
eleven of whom are monsters promoted to a name and a line, and the rest of whom
stand in one place and sell you something and know one thing you need. Every
zone has at least two living voices, except the Stone Garden and the Teeth,
which have one and none by design, because the story needs a place where you
lose your reader and a place where nothing speaks.

Every topic above is a `{ when, say, sets }` row for `story.js`. The gates are
the facts of `10-STORY.md` section 8, and the audit there holds here: every
fact a line sets is read by another line somewhere, and every fact a line
reads is set somewhere, or the thread dangles and the audit throws.

<script type="text/markdown" id="md-thirteen" data-title="The Thirteen" data-sub="The ones built to be remembered, and the rule">
# Brackenwake: the ones you do not forget

`11-CAST.md` puts sixty named people in the world. Most of them are there so a
zone has voices in it. This book is about the thirteen who are there so the
player remembers the game ten years later, and it says what each of them is
built from, so the writing and the systems can be held to it.

## What makes a character impossible to forget

Not a backstory. Nobody remembers a backstory. Five things, and a character
in this book has all five:

1. **A contradiction you can say in one sentence.** A kind man who ends the
   world. A king who cannot die because he asked not to. A dead child keeping
   a stone clean for a father who killed the kingdom. The sentence is the
   hook; a player tells it to a friend.
2. **A signature.** One thing they always do or say, so that the second time
   you meet them you know them before they speak, and the last time it breaks
   your heart because it is the same. Hesk says "oh" softly. Caradoc has one
   message. Ulfra shivers and the snow melts.
3. **A secret that flips them.** Something the player learns, late, that makes
   every earlier scene mean something else. Not a twist for its own sake: the
   flip has to make them *more* themselves, not different.
4. **A mechanic.** Something the player *does* with them that nobody else in
   the game offers, so the memory is in the hands, not only the ears. You lie
   to Corvin. You light Lowri's lamps. You give the Straggler directions. You
   keep or break a promise to a dead girl and a king weeps or does not.
5. **They come back.** A character met once is a set piece. A character met
   four times across the map, changed each time, is a person. Everyone in
   this book is in at least two zones or two acts, and their last scene rhymes
   with their first.

And one rule over all five: **they want something the player cannot give them.**
Ossian wants to be asked. Fern wants to go home. Ysolt wants her brother. Ulfra
wants her people to stop dying. The player can help, or end it, or lie. They
cannot give it. That is what makes the player remember: the thing they could
not do.

## The thirteen

### 1. Maud Fallow, who sends you and lies about why

**Hook.** The old woman who reads the stones sent you out to save the valley
and knew the whole time that the valley is saved by someone sitting in a
chair until they die, and that her sister was that someone, and that you are
next.

**Signature.** She touches the nearest boundary stone before she answers
anything. In Act IV, at the Sink's mouth, there is no stone, and she reaches
for one, and her hand closes on nothing, and she tells you the truth.

**Secret.** She did not send you to find out why the hedges fail. She knows
why. She sent you out so you would be strong enough to come back and sit down,
and so she would not have to ask a stranger. She has been choosing between
you and Tam since the day the stones named you.

**Mechanic.** Every return to the Vale between acts, Maud has one more thing
to say that she should have said before, and the player can press her or let
her go. Pressing costs nothing in the world and everything in the scene: she
answers, and the answer is always half. The journal records what she has
admitted so far. By Act IV the player has a list of the things Maud did not
say, and she says them all.

**The scene.** The Sink's mouth. Torchlight, wind coming up the stair, the Vale
fighting behind you. "You can stand in it. Not for ever. Longer than us." And
then, because Tam is there: "Or he can."

**Recurs.** Every act, in the Vale. Her cottage is the door.

### 2. Tam Weir, who grows up while you watch

**Hook.** The miller's boy who follows you because he has nothing else to do
turns out to be the last of the line that built the kingdom, and the one
person the chair fits better than you.

**Signature.** He is always slightly ahead of you on the road. In Act IV, on
the stair down the Sink, he is behind you for the first time, and you notice.

**Secret.** He has known since the Weir Tower. Wynn told him not to go south,
and he heard why, and he never said, and he kept walking with you anyway. When
he says at the chair "it should be me," it is not a boy's impulse. He decided
two acts ago.

**Mechanic.** Tam levels. Not in numbers: in what he does. Act I he is a
slingshot and a warning. Act II, taught the bow by Brannoc if the player let
him, he shoots. Act III he carries his father's cloak and knife and stands in
fights. He can die, in the world, at any point, and if he does the game goes
on without him and the chair has one fewer candidate and Maud's last line is
different. Keeping Tam alive to the end is the game's one escort quest, and it
is never written down anywhere.

**The scene.** Thornwood, the cold fire, his father's knife in his hand. He does
not cry. "Can I keep walking with you?"

**Recurs.** Every zone the player takes him to. Nearly all of them.

### 3. Brother Hesk, the kindest man on the continent, who ends it

**Hook.** The gentle scholar who is the only person able to read the old
words reads them, believes them, and goes to wake the thing everyone else has
spent three hundred years keeping asleep, because he thinks it is a child
having a nightmare and someone should hold it.

**Signature.** He holds every object you show him up to the lamp, turns it,
and says "oh" softly before he says anything else. In the Sallow Wastes, as a
lich, you show him the shard, and he holds it up to a light that is not
there, and says "oh."

**Secret.** He is right. Or right enough that the game never says he is wrong.
The Guest was dropped, does not want to be here, dreams badly, and the third
ending proves that waking it stops the Wake. Hesk's crime is not being wrong.
It is doing it alone, and needing a Weir's voice to finish, and knowing whose.

**Mechanic.** Hesk is the reader. Every readable in the world the player cannot
read, Hesk can, and the player carries them to him and he reads them aloud,
and what he reads is the story. When he leaves, the player is illiterate in
their own story until they find another reader, and there are two, and one is a
dead king and the other is Hesk. The player *feels* the betrayal as a lost
ability.

**The scene.** The camp below the Stone Garden, morning, Hesk's blanket folded,
a letter on it. "I think I can end it. Look after the boy." He has taken Tam's
father's knife. The player realises, later, why.

**Recurs.** Ashen Moor, the Stone Garden, the Sallow Wastes, and his voice in
the Bone Dragon's mouth.

### 4. Ysolt of the Strand, who will not sail east until she will

**Hook.** The salvager who has spent twenty years charting a drowned coast she
refuses to sail to, because her brother is standing on its steps every night
in a line of the dead, and she has not decided what she owes him.

**Signature.** She sews, and never pricks herself, and never looks at the
needle. On the boat to the Drowned Coast she is not sewing. Her hands are on
the tiller and they are shaking and she does not hide it.

**Secret.** She has been to the Drowned Coast. Once. She saw Aled in the line
and rowed back and told nobody, including Hedd, and the "two boats lost" were
one boat lost and one boat she scuttled so she would have an excuse not to go
again.

**Mechanic.** Ysolt is the boat. The Drowned Coast cannot be reached without
her, and she will not sail for money, only for a reason she believes, and the
reasons are: the player has met the Ashen King, or the Frostcrown's thane, or
carries the coldiron sword. Then, at the Steps, Aled is her choice and not the
player's: the player can hold the line, or fight the knight, or ask him, but
the hand that touches Aled is Ysolt's, and the player watches.

**The scene.** Aled stops in the line. The line stops behind him. Caradoc turns
his head. Ysolt walks down three steps into the water in her boots and puts a
hand on her brother's face, and the knight says: "Take him. I did not ask him
to come."

**Recurs.** Saltmere, the Broken Strand, the Drowned Coast, the Vale in Act IV
with a boat crew who came inland for the first time in their lives.

### 5. Fern, who is ten and has been ten for three hundred years

**Hook.** A dead child keeps the moss off a stone in a silent wood, waiting for
a servant to come and take her home to her father, who was the king who ended
the kingdom, and she does not know that she is dead or that he is on a chair of
glass or that the blossom falling around her is the wood grieving for her.

**Signature.** She brushes petals off the stone as she talks, and there are
always more. When the player comes back from Cinderreach with an answer for
her, the petals have stopped falling, for the length of the scene.

**Secret.** She knows. Not in words. She knows the way children know a thing
adults have decided not to tell them: she asks if her father has stopped being
angry because she remembers him weeping as he put her on the horse, and she
has spent three hundred years deciding that meant anger, because the other
thing it could mean is worse.

**Mechanic.** The promise. She asks you to tell her father she is being good.
You can promise. At Cinderreach, before the Ashen King, the game gives you the
line, and you can say it or not, and the fight is different either way: he
weeps and does not use the crown and is slow, or he does not and it is what it
is. Then you come back to Witchwood, and she asks what he said, and you tell
her the truth or you do not, and the wood answers: the blossom falls all at
once, or the birds come back. Nobody tells the player this is a mechanic. It
is just a promise.

**The scene.** "Has my father stopped being angry?"

**Recurs.** Witchwood twice, and her name on Anwen Tide's family tree in
Cinderreach with no date of death, and Sir Bryn in the Long Dark: "I left her
at a stone in a wood where the blossom was. I did not go back."

### 6. Ossian, the Ashen King, who asked not to die

**Hook.** The last king welcomed the thing that fell, asked it for a weir
against death, and got one, for himself alone, and has sat on a chair of glass
for three hundred years being the proof that the Wake cannot be ended by
loving it.

**Signature.** He does not move anything but his eyes until he stands, and
when he stands the glass floor cracks under him. Before that: "Sit down.
Nobody has sat down in a very long time." There is a second chair. Sitting in
it is the game's most frightening button.

**Secret.** He never wanted the throne. He was the youngest, and his brothers
died in the flood year, and the weir against death was not for him. It was
for Fern. He asked it to keep his daughter alive, and it heard "keep the one
who asks," and she died on the road inland anyway, and he has known for three
hundred years that the kingdom drowned for a wish that missed.

**Mechanic.** The conversation is the fight's difficulty. Every true thing the
player brings him (the rhyme, the sword, Bryn's account of him weeping, Fern's
promise) is a line he answers, and each answer changes the fight: slower, no
crown, no crypt summon, until, with everything, he stands and says "be quick"
and the fight is a formality and the player has to do it anyway. A player who
brings nothing fights the full boss. Both are the right ending. Only one is
remembered.

**The scene.** The promise kept. "She is being good." He puts a hand over his
eyes. Glass runs down his face, because it is glass.

**Recurs.** Named in the Barrows (an empty coffin), the Hollow Hills (Wynn's
recitation), the Long Dark (Bryn saw him weep), Cinderreach, and the crown he
leaves, which speaks in the Night March.

### 7. Sir Caradoc, the Drowned Knight, who has one message

**Hook.** The knight marshal who held the sea gate until the water was over his
head and has walked up the same steps every night for three hundred years to
find the sea still there, carrying one message for a keeper he has never met,
with nobody to give it to.

**Signature.** Water pours off him the whole time he speaks and the pool at
his feet never grows.

**Secret.** He knows the gate did not hold. The sea came over it. He held his
post while it did, and the message he has carried for three centuries is a
lie he has told himself so long it has become a duty, and when the player
brings him the truth about the seventh weir he understands, at last, what he
has been: not a failed gate. A weir with a man in it. He laughs, once. It is
the saddest sound in the game.

**Mechanic.** He can be fought without being killed. Yield at a quarter health
and he stops and gives you the message. Kill him and the drowned scatter and
the coast is safer and the message is lost, and Maud in Act IV asks if you met
him, and you say what you did. Either is allowed. The game never says which
was right.

**The scene.** "The Weir Kings never built a weir that did not have a man in
it. The stone was only ever there to give the man something to lean on." And
then: "Tell the Vale's keeper the gate held."

**Recurs.** The Drowned Coast, and the Reeve at Saltmere is his, and his line
is what Maud repeats at the chair.

### 8. Ulfra Coldseat, forty feet of woman shivering on a hole in the world

**Hook.** The thane of the frost giants sits on the mouth of a shaft that goes
down to the Guest's own heat, because a giant is the only thing large enough
to be a weir against warmth, and her people have been dying of the cold she
makes for three hundred years, and she knows, and she sits.

**Signature.** She shivers. Every time she does, the snow around the shaft
melts a little further, and she looks at it.

**Secret.** She and Maud have written to each other, by runner, every ten years,
for fifty years. Two women sitting on two holes. Neither has ever seen the
other. Ulfra's message for Maud is "tell her we are still here," and Maud's
last message to Ulfra, which the player never sees, said "my sister is dying,
I do not know who is next," and Ulfra has been waiting for the answer for a
year. The player is the answer.

**Mechanic.** The giants do not attack. The whole zone is being small among
people who could end you and choose not to, and the fear is different from
every other zone's fear. Ulfra moves off the shaft once, for the player, if
they carry a message for Maud, and while she is off it the zone gets warmer,
visibly, the snow line creeping down while you are underground, and you come
up and she is back on it and it is snowing again.

**The scene.** "Your people sit on it too. Ours just sits harder."

**Recurs.** The Frostcrown, and Hild's apprentice is her daughter, and in Act IV
she cannot come to the Vale and sends the cold: the Sink's stair is frosted
from the third landing down, and Maud says "Ulfra," and that is all.

### 9. Marshal Corvin, who asks if you are it

**Hook.** A general who marched the kingdom's last army north to draw the Wake
off and drew it off and died in a frozen wood, and has sat at the bottom of a
shaft with his sword across his knees for three hundred years waiting for
someone to come and say the word, and does not know what the word will do.

**Signature.** His hand rests on the sword and never closes on it. If you say
yes, it closes.

**Secret.** He knows what the word will do. He has heard his men say it in
their sleep for three centuries. He asks "are you it?" not because he cannot
tell, but because he wants to be told no, and be allowed to keep waiting, and
he has never been allowed to want anything.

**Mechanic.** The lie. Wearing the Ashen King's crown, you can say yes. Nothing
happens. The March comes up at dusk as always. Nothing happens for the rest of
Act III. Then, in Act IV, if you take the third door and go south to wake the
Guest, the March is there, in ranks, in the Sallow Wastes, having walked the
length of the continent in the dark to stand behind you, because you said
yes. It is the only time the game rewards a lie, and it is the most
frightening reward in it. Say no and he says "then we wait," and they do, and
that is its own ending for him.

**The scene.** "Nobody came to tell us we could stop. Are you it?"

**Recurs.** The Night March, and the March itself anywhere the crown is worn,
and the Sallow Wastes in the third ending.

### 10. Lowri Lamp, who has not had a night off in thirty years

**Hook.** A woman who lights lamps along a tree line every dusk because the
dead stop at the lamps and she does not know why, and has done it every night
for thirty years, and her husband is in the third rank, and she has never told
anyone.

**Signature.** She trims a wick while she talks and her hands never stop. On
her night off, her hands are in her lap, and she does not know what to do with
them.

**Secret.** The dead do not stop at the lamps. They stop at her. She has been
standing in the Wake every dusk for thirty years, and she is a weir, a small
one, and does not know it, and the player, who has by now heard what a keeper
is, is the only one who can see what she is. The lamps are what she leans on.

**Mechanic.** The night off. Light the lamps for her, one dusk, all forty,
before the March comes up, and she sleeps for the first time in thirty years,
and in the morning she tells you about her husband, and the March that night
came to the lamps and stopped, as always, because the player was standing
there. The player feels their own weir-ness for the first time and the game
does not say so.

**The scene.** Morning. Her hands in her lap. "He is in the third rank. Fourth
from the left. He was tall. He still is."

**Recurs.** The Night March, and she is in the Vale's lane in Act IV with a lamp,
because she heard, and she says "one night off. You gave me one. I owe you the
rest."

### 11. Enid Brick, who bricked her husband in

**Hook.** A potter who walled her husband into a kiln from the outside when he
came back from the cellars changed, because she could not kill him and could
not let him out, and has thrown the same pot on the wheel every day since,
selling them to the bandits who live where he went wrong.

**Signature.** The pot. It is always the same pot. Nobody has ever seen her
finish one.

**Secret.** He knocks. Every night. She has sat with her back to the kiln every
night for eleven years listening to him knock, and the reason she will not let
the player open it in Act I is not fear. It is that she is not finished
listening.

**Mechanic.** The kiln is a door the player can open at any time. Enid asks
them not to, and the game lets them anyway, and what comes out is the Bricked
Man, a zombie in a potter's apron, and he is slow and sad and easy to kill and
the player should feel like a thief. Or the player waits, and in Act III she
asks, and the fight is the same and the feeling is not. Or the player never
does, and in Act IV she is in the Vale's lane with a pot, finished, the first
one, and gives it to you, and it is a funeral urn.

**The scene.** Act III. "You want to know why. Come back when you have been
down the Cellars." You have. She tells you about the knocking.

**Recurs.** Kiln Heath twice, the Vale in Act IV.

### 12. Aldous the Quiet, who corrects his skeleton's posture

**Hook.** A necromancer who has lived among a thousand graves for thirty years
asking the dead questions, not to use them or free them or heal them, but to
know, and who has learned more about the Wake than anyone alive and has told
almost none of it to anyone, because nobody asked properly.

**Signature.** A skeleton holds his lamp. He corrects its posture twice in
every conversation, gently, the way you would a nephew.

**Secret.** The skeleton is his brother. Aldous raised him the year he came to
the Barrows, and has never let him lie down again, and has never once asked
him a question, because he is afraid of the answer, and every other dead
thing on the continent has been a way of not asking.

**Mechanic.** Aldous teaches necromancy, and the first lesson is the game's
first raised skeleton, and the player's own skeleton behaves like his: it
holds things, it follows, it can be corrected. Necromancers who learn from
Aldous get a skeleton that is a little more person than the ones from the
book. And the Barrows' dead stand up at midnight and face the Fall, and Aldous
has never once stood with them, and if the player does, the next dawn he asks
what it was like.

**The scene.** Late, the Long Barrow, Act III, the player back from the rim.
Aldous asks what the King said. The player tells him. Aldous turns to the
skeleton with the lamp and says, for the first time, "Owain. Was it like that?"
And the skeleton does not answer, because they do not, and Aldous nods as if
it had.

**Recurs.** The Grey Barrows in every act, and the Sink's door in Act IV, with
his skeleton holding the lamp, and he goes down the stair behind you and stops
at the first landing and reads the name on the wall and stays there.

### 13. Selwyn, the Walker before, who offers cold water

**Hook.** The charming cultist captain who keeps turning up one zone ahead of
you with a cup of cold water in a hot country was the Vale's Walker two
generations ago, sent out by a younger Maud, and he found out what the hedges
are made of, and chose the Wake, and has been waiting for the next Walker to
explain it to.

**Signature.** He offers you water first, always, and it is always cold, and
nothing else around him is. In the Vale, in Act IV, in the lane, he offers
you water, and it is warm, and he looks at the cup, and it is the only time
he is not smiling.

**Secret.** Osric knows. "Every Walker orders the same thing." Selwyn sat in
the Bracken Arms' chair forty years ago and ordered it, and Osric, who was a
boy pulling pints, remembers, and has never told Maud he saw the same man in
Crookwell market twenty years later wearing the Guest's mark. Selwyn is what
the Vale does not talk about: the Walker who came back and was not let in.

**Mechanic.** The mark. Selwyn offers it at every meeting, and it is a real
item, and taking it sets a fact that every character in the game reads: the
cultists become friendly and everyone else notices, Maud most of all, and the
third ending becomes easier and the first two become harder, and it can be
taken off, and everyone remembers that you wore it. He is the game's one
recurring villain who is not a monster and never draws a weapon. You cannot
fight him. He walks away every time. In Act IV he is in the lane, and does not
walk away, and does not fight, and says: "I sat in that chair for a week. Did
she tell you that? A week. Then I got up. Ask her what she did."

**The scene.** Kiln Heath, the first meeting, before the player knows anything.
A man in clean robes in a filthy country, a cup of water so cold it hurts.
"You are the new one. She has not told you yet. She never does at first. Drink.
It is only water."

**Recurs.** Kiln Heath, the Ember Flats, the Sallow Wastes, the Vale in Act IV.
Always one zone ahead. Always the same cup.

## How they cross

A character remembered is a character met twice. The table is who stands
where, so the zones can be written to it:

| | Vale | I ring | II ring | III ring | Sink |
| --- | --- | --- | --- | --- | --- |
| Maud | every act | | | | mouth |
| Tam | I, IV | Mill Run, Thornwood | all | all | chair |
| Hesk | | | Ashen Moor, Stone Garden | Sallow | |
| Ysolt | IV | Saltmere | Strand | Drowned Coast | mouth |
| Fern | | | Witchwood | named in Cinderreach | |
| Ossian | | named in Barrows | named in Hills, Long Dark | Cinderreach | crown |
| Caradoc | | Reeve at Saltmere | | Drowned Coast | message |
| Ulfra | | | | Frostcrown | the cold |
| Corvin | | | | Night March, Sallow | |
| Lowri | IV | | | Night March | |
| Enid | IV | Kiln Heath | | Kiln Heath | |
| Aldous | | Barrows, every act | | | door, first landing |
| Selwyn | IV | Kiln Heath | Ember Flats | Sallow | lane |

Every column has at least three of them. No zone in the rings is without one.

## What this changes in the other two books

- `11-CAST.md`, the Recruiter: he is Selwyn, and he was a Walker, and his
  entry is rewritten below this line in that file.
- `11-CAST.md`, Osric: gains the topic "the Walker who came back" [met:selwyn].
- `11-CAST.md`, Aldous: the skeleton is Owain, his brother, and the Act III
  scene is his.
- `10-STORY.md`, Cinderreach: Ossian's wish was for Fern. The Arrival and the
  fight stand; the conversation gains the line.
- `10-STORY.md`, the Night March: the third-ending payoff of Corvin's yes is
  the March in the Sallow Wastes, and belongs in the Sallow Fall's Act IV
  description.
- `10-STORY.md`, the Sink: Lowri, Enid, Ysolt's crew, Aldous and Selwyn are in
  the lane, each with the line above.

The rule for anyone adding a character after this: if you cannot fill in all
five things in section one, they are a vendor. That is fine. Give them a tell
and a fact and let them sell bread. But do not put them in this book.
