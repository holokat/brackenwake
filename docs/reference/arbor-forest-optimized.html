<!doctype html><html><head><meta charset="utf-8">
<!--
ARBOR FOREST — procedural infinite forest (three.js r160, single file, no build step)

WHAT THIS IS
  A streamed, seed-deterministic forest zone: 96 m terrain+tree chunks around the viewer,
  24 m grass chunks (3 rings, LOD-thinned), and a 3x3 forage layer (mushrooms, berries, honey...).
  Everything is procedural: bark/leaf/grass textures are drawn on canvases at startup; no assets.

ENTRY POINTS (bottom of the script)
  S              — all settings (JSON). Same seed + settings => identical world.
  api.set(k,v)   — change one setting live (environment keys apply instantly; forage keys
                   rebuild only the forage layer; anything else regrows the world).
  api.setMode('orbit'|'look'), api.setWire(bool), api.regen(), api.dispose()
  HOST           — optional callbacks: onFps(n), onCount(trees), onForage({name:count}),
                   onForageList([...]), onBuilt()

CONTROLS
  Orbit: drag to orbit, wheel to zoom, WASD to fly. Walk: drag to look, WASD/arrows, Shift = run.

PERFORMANCE DEFAULTS (tuned for a laptop GPU at ~60 fps)
  quality 'Balanced' => DPR 1.25, 2048 shadow map, PCF (not soft), shadows only on the
  nearest chunk ring, leaf LOD beyond ring 1 (1/3 quads at 1.8x size), frustum culling on every
  instanced mesh, grass 2.6 tufts/m^2 near (x0.5 / x0.25 in outer rings), fading 70-100 m.
  To go faster: S.quality='Performance', S.view='Near', S.grass=0.5.
  To go prettier: S.quality='High', S.view='Far', S.grass=1.3.

TUNING KNOBS
  World:  biome (Temperate broadleaf | Boreal conifer | Tropical wet | Birch grove | Mediterranean pine),
          density (Open|Natural|Dense), view (Near|Medium|Far), seed
  Trees:  heightScale, crownSpread(20-80), trunkRadius, maturity(0-1), gnarl(0-1), foliage, autumn(0-1)
  Ground: groundCover, grass(0-2), relief(0-2)
  Light:  timeOfDay(6-20), fog(0-3), wind(0-1.5)
  Forage: season (Spring|Summer|Autumn), forage(abundance), forageScale, forageOn {name:false to hide}

EXTENDING
  SPECIES / BIOMES / FORAGE tables near the top of the engine are plain data + small builder
  functions; add an entry and it streams in automatically. Tree growth is in growAxis()
  (apical leader + golden-angle laterals); terrain in terrainH(); placement in layoutTrees().
-->
